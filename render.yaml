# Render Blueprint: in Render choose "New → Blueprint" and pick this repository.
# One free web service in Frankfurt. Secrets are never in this file:
# - MCP_TOKEN is generated by Render (copy it into the Claude connector's "Request headers")
# - the two database URLs are asked for when the blueprint is created (sync: false)
# The owner's DATABASE_URL is deliberately NOT here: migrations run from the laptop only.
services:
  - type: web
    name: finance-agent
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: >-
      pip install uv &&
      uv export --frozen --no-dev --no-hashes -o requirements.txt &&
      pip install -r requirements.txt
    startCommand: python -m app.server
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: MCP_TOKEN
        generateValue: true
      - key: APP_DATABASE_URL          # finance_app: add and change, never delete
        sync: false
      - key: READONLY_DATABASE_URL     # finance_reader: views only (run_query)
        sync: false
      - key: APP_TIMEZONE
        value: Europe/Amsterdam
