[project]
name = "finance-agent"
version = "0.1.0"
description = "Personal expense tracker you talk to through Claude: a remote MCP server + PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
